[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crestfc"
version = "0.1.0"
description = "Causal Relation Steering for Trustworthy Fact-Checking"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "transformers>=4.45", "numpy>=1.24", "scikit-learn>=1.3", "PyYAML>=6", "safetensors>=0.4", "tqdm>=4.60"]

[project.optional-dependencies]
train = ["peft>=0.12"]
test = ["pytest>=8"]
plots = ["matplotlib>=3.7"]

[project.scripts]
crestfc = "crestfc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
